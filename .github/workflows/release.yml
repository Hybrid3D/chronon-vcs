name: Release

# Tagging is the entire release trigger: `git tag v0.2.4 && git push release v0.2.4`
# builds the distributions, attaches them to a GitHub Release (which is what
# makes `pipx install git+...@v0.2.4` reproducible), and publishes to PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import re
          import pathlib
          import sys

          source = pathlib.Path("src/chronon/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__ = "([^"]+)"', source).group(1)
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if version != tag:
              sys.exit(f"tag {tag!r} does not match __version__ {version!r}")
          print(f"releasing {version}")
          PY

      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*

      - name: Install the built wheel and exercise the entry points
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --upgrade pip
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/chronon --version
          /tmp/verify/bin/chronon --help
          /tmp/verify/bin/python -c "import chronon.mcp_server"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/

  github-release:
    name: Attach distributions to the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.3.3
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Trusted publishing: configure this environment and the publisher at
    # https://pypi.org/manage/account/publishing/ before the first tag.
    # No API token is stored in this repository.
    environment:
      name: pypi
      url: https://pypi.org/p/chronon-vcs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
