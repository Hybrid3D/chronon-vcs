[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chronon-vcs"
dynamic = ["version"]
description = "Local, document-oriented immutable history indexed by time"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "mcp", "version-control", "yaml", "json"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control",
]
dependencies = [
  "filelock>=3.16,<4",
  "jsonschema>=4.23,<5",
  "mcp>=1.14,<2",
  "PyYAML>=6.0.2,<7",
  "typer>=0.18,<1",
]

[project.urls]
Homepage = "https://github.com/Hybrid3D/chronon-vcs"
Repository = "https://github.com/Hybrid3D/chronon-vcs"
Issues = "https://github.com/Hybrid3D/chronon-vcs/issues"
Changelog = "https://github.com/Hybrid3D/chronon-vcs/releases"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pip-audit>=2.9",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.9",
  "twine>=6",
]

[project.scripts]
chronon = "chronon.cli:main"
chronon-mcp = "chronon.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "chronon.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["chronon"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
ignore = ["B008"] # Typer declares CLI metadata in function defaults by design.
